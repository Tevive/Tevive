<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 500px; height: 300px;
    background: #0e0e0e;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    color: #e8e8e8;
    overflow: hidden;
    user-select: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 28px;
  }
  .wordmark {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #ffffff;
  }
  .wordmark span {
    color: #1a9fff;
  }
  .tagline {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #444;
  }
  .track {
    width: 280px;
    height: 2px;
    background: #1a1a1a;
    border-radius: 1px;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    background: #1a9fff;
    width: 0%;
    border-radius: 1px;
    animation: load 1.2s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  @keyframes load {
    0%   { width: 0%; }
    50%  { width: 65%; }
    85%  { width: 90%; }
    100% { width: 100%; }
  }
  .ver {
    position: absolute;
    bottom: 14px;
    right: 18px;
    font-size: 9px;
    color: #2a2a2a;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">TEV<span>I</span>VE</div>
  <div class="tagline">Free Game Platform</div>
  <div class="track"><div class="fill"></div></div>
</div>
<div class="ver">v1.0.0</div>
</body>
</html>
