<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 500px; height: 300px;
    background: #0a0a0a;
    font-family: 'Space Mono', 'Courier New', monospace;
    color: #f0f0f0;
    overflow: hidden;
    user-select: none;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 24px;
    padding: 40px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 48px;
    height: 48px;
    background: #22c55e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 900;
    color: #0a0a0a;
    letter-spacing: -1px;
  }
  .logo-text {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #f0f0f0;
  }
  .tagline {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555;
  }
  .bar-track {
    width: 300px;
    height: 2px;
    background: #1a1a1a;
    position: relative;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: #22c55e;
    width: 0%;
    animation: load 1.1s ease-out forwards;
  }
  @keyframes load {
    0%   { width: 0%; }
    60%  { width: 75%; }
    90%  { width: 92%; }
    100% { width: 100%; }
  }
  .version {
    position: absolute;
    bottom: 16px;
    right: 20px;
    font-size: 10px;
    color: #333;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">T</div>
    <div class="logo-text">Tevive</div>
  </div>
  <div class="tagline">The free game platform</div>
  <div class="bar-track">
    <div class="bar-fill"></div>
  </div>
</div>
<div class="version">v1.0.0</div>
</body>
</html>
