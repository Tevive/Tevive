<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0e0e0e; font-family: 'Segoe UI', Arial, sans-serif; color: #aaa; display: flex; align-items: center; justify-content: center; }
  .wrap { text-align: center; max-width: 400px; padding: 40px; }
  .code { font-size: 64px; font-weight: 900; color: #1a1a1a; line-height: 1; margin-bottom: 16px; }
  .title { font-size: 18px; font-weight: 700; color: #e8e8e8; margin-bottom: 8px; }
  .sub { font-size: 12px; color: #555; line-height: 1.6; }
  button { margin-top: 24px; padding: 8px 20px; background: #1a9fff; color: #fff; border: none; border-radius: 3px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:hover { background: #2aafff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">!</div>
  <div class="title">Tevive konnte nicht geladen werden</div>
  <div class="sub">Die Anwendung konnte nicht gestartet werden. Bitte starte Tevive neu.</div>
  <button onclick="location.reload()">Neu laden</button>
</div>
</body>
</html>
