<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tevive - Gaming Platform</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #0a0e14; color: #c7d5e0; font-family: 'Segoe UI', sans-serif; }
body { display: flex; flex-direction: column; }

:root {
  --bg0: #0a0e14;
  --bg1: #171a21;
  --bg2: #1b2838;
  --bg3: #1e2329;
  --bdr: #2a475e;
  --txt: #c7d5e0;
  --txt2: #8f98a0;
  --txt3: #556672;
  --blue: #1a9fff;
  --green: #4c6b22;
  --green2: #beee11;
  --red: #c94040;
  --red2: #ff6b6b;
  --yellow: #fbbf24;
  --purple: #a78bfa;
}

/* Auth Screen */
#auth-screen {
  position: fixed;
  inset: 0;
  background: var(--bg1);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.auth-card {
  background: var(--bg3);
  border: 1px solid var(--bdr);
  border-radius: 8px;
  width: 420px;
  overflow: hidden;
}

.auth-logo-wrap {
  text-align: center;
  padding: 32px 0 20px;
}

.auth-logo-img {
  width: 120px;
  height: 120px;
  margin: 0 auto 12px;
  filter: brightness(0) invert(1);
}

.auth-logo {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #fff;
}

.auth-tabs {
  display: flex;
  border-bottom: 1px solid var(--bdr);
}

.auth-tab {
  flex: 1;
  padding: 12px;
  background: transparent;
  border: none;
  color: var(--txt2);
  cursor: pointer;
  font-weight: 600;
  border-bottom: 2px solid transparent;
  transition: all .2s;
}

.auth-tab.active {
  color: #fff;
  background: rgba(26, 159, 255, .08);
  border-bottom-color: var(--blue);
}

.auth-form {
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.auth-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.auth-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--txt2);
  text-transform: uppercase;
  letter-spacing: .6px;
}

.auth-input {
  background: #1e2d3d;
  border: 1px solid var(--bdr2, #3d5a73);
  border-radius: 2px;
  padding: 9px 10px;
  color: #fff;
  font-size: 13px;
  outline: none;
  transition: border-color .15s;
}

.auth-input:focus {
  border-color: var(--blue);
}

.auth-error {
  font-size: 11px;
  color: var(--red2);
  background: rgba(201, 64, 64, .1);
  border: 1px solid rgba(201, 64, 64, .3);
  border-radius: 2px;
  padding: 7px 10px;
  display: none;
}

.auth-error.show {
  display: block;
}

.auth-submit {
  background: var(--green);
  color: var(--green2);
  border: none;
  border-radius: 2px;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 3px;
  transition: background .15s;
}

.auth-submit:hover {
  background: #5a7e28;
}

.auth-footer {
  font-size: 11px;
  color: var(--txt3);
  text-align: center;
  padding: 10px;
  border-top: 1px solid var(--bdr);
}

/* App Shell */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.hdr {
  display: flex;
  align-items: center;
  height: 36px;
  background: var(--bg0);
  border-bottom: 1px solid #000;
  padding: 0 14px;
}

.hdr-logo {
  width: 200px;
  display: flex;
  align-items: center;
  padding: 0;
  height: 100%;
  border-right: 1px solid #0d1117;
  font-weight: 900;
  font-size: 13px;
  letter-spacing: 1px;
  color: #fff;
}

.hdr-nav {
  display: flex;
  gap: 1px;
  height: 100%;
  align-items: center;
  margin-left: 6px;
}

.hdr-nav a {
  font-size: 11px;
  font-weight: 600;
  color: var(--txt2);
  padding: 0 11px;
  height: 100%;
  display: flex;
  align-items: center;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: .4px;
  border-bottom: 2px solid transparent;
  transition: all .15s;
}

.hdr-nav a:hover {
  color: #fff;
  text-decoration: none;
}

.hdr-nav a.active {
  color: #fff;
  border-bottom-color: var(--blue);
}

.hdr-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding-right: 12px;
}

.hdr-user {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  padding: 3px 7px;
  border-radius: 2px;
  transition: background .15s;
}

.hdr-user:hover {
  background: var(--surf, #252f3d);
}

.avatar {
  width: 22px;
  height: 22px;
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
}

.hdr-username {
  font-size: 12px;
  font-weight: 600;
  color: #fff;
}

.verified-badge {
  width: 13px;
  height: 13px;
  background: var(--blue);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.verified-badge svg {
  width: 7px;
  height: 7px;
  fill: #fff;
}

.admin-badge {
  font-size: 8px;
  font-weight: 800;
  background: var(--purple);
  color: #fff;
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: .5px;
}

.body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.sidebar {
  width: 200px;
  flex-shrink: 0;
  background: var(--bg1);
  border-right: 1px solid #0d1117;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sb-section {
  font-size: 9px;
  font-weight: 800;
  color: var(--txt3);
  letter-spacing: 1.8px;
  text-transform: uppercase;
  padding: 13px 12px 4px;
}

.sb-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  color: var(--txt2);
  cursor: pointer;
  font-size: 12px;
  border-left: 2px solid transparent;
  transition: all .1s;
}

.sb-item:hover {
  background: #1a2635;
  color: #fff;
}

.sb-item.active {
  background: #1e3a5f;
  color: #fff;
  border-left-color: var(--blue);
}

.sb-item svg {
  width: 13px;
  height: 13px;
  fill: currentColor;
  opacity: .75;
}

.sb-item.active svg {
  opacity: 1;
}

.sb-badge {
  margin-left: auto;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 8px;
}

.sb-badge.blue {
  background: var(--blue);
  color: #fff;
}

.sb-badge.green {
  background: var(--green);
  color: var(--green2);
}

.sb-badge.red {
  background: var(--red);
  color: #fff;
}

.sb-divider {
  height: 1px;
  background: #0d1117;
  margin: 5px 0;
}

.sidebar-bottom {
  margin-top: auto;
  padding: 8px 0;
  border-top: 1px solid #0d1117;
}

.main {
  flex: 1;
  overflow-y: auto;
  background: var(--bg2);
}

.page {
  display: none;
}

.page.active {
  display: block;
}

/* Dashboard */
.hero-banner {
  position: relative;
  height: 260px;
  overflow: hidden;
  background: linear-gradient(135deg, #0d1b2a, #1a3a5c);
  flex-shrink: 0;
}

.hero-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(.35);
}

.hero-content {
  position: relative;
  z-index: 1;
  padding: 22px 24px;
  max-width: 520px;
}

.hero-tag {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--green2);
  background: rgba(76, 107, 34, .35);
  border: 1px solid rgba(190, 238, 17, .25);
  padding: 2px 7px;
  border-radius: 1px;
  display: inline-block;
  margin-bottom: 7px;
}

.hero-title {
  font-size: 24px;
  font-weight: 900;
  color: #fff;
  line-height: 1.1;
  margin-bottom: 5px;
  text-shadow: 0 2px 8px rgba(0, 0, 0, .9);
}

.hero-desc {
  font-size: 11px;
  color: #c7d5e0;
  line-height: 1.6;
  margin-bottom: 12px;
}

.hero-btns {
  display: flex;
  gap: 7px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 16px;
  border-radius: 2px;
  font-size: 12px;
  font-weight: 600;
  transition: all .15s;
  cursor: pointer;
  border: none;
  outline: none;
}

.btn-green {
  background: var(--green);
  color: var(--green2);
}

.btn-green:hover {
  background: #5a7e28;
}

.btn-blue {
  background: var(--blue);
  color: #fff;
}

.btn-blue:hover {
  background: #2aafff;
}

.btn-ghost {
  background: transparent;
  color: var(--txt);
  border: 1px solid var(--bdr2, #3d5a73);
}

.btn-ghost:hover {
  background: var(--surf, #252f3d);
  border-color: var(--txt2);
}

.btn-sm {
  padding: 4px 11px;
  font-size: 11px;
}

.sec {
  padding: 14px 18px 0;
}

.sec-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--bdr);
}

.sec-title {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 7px;
}

.sec-title::before {
  content: '';
  display: block;
  width: 3px;
  height: 13px;
  background: var(--blue);
  border-radius: 1px;
}

.sec-more {
  font-size: 11px;
  color: #66c0f4;
  cursor: pointer;
}

.sec-more:hover {
  color: var(--blue-h, #4ab8ff);
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 7px;
}

.game-card {
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
  border: 1px solid var(--bdr);
  cursor: pointer;
  transition: all .1s, transform .1s, box-shadow .15s;
}

.game-card:hover {
  border-color: var(--blue);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
}

.gc-thumb {
  width: 100%;
  aspect-ratio: 92 / 43;
  background: var(--surf, #252f3d);
  overflow: hidden;
  position: relative;
}

.gc-thumb img {
  width: 100%;
  height: 100%;
}

.gc-ph {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #1a2535, #252f3d);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--txt3);
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  padding: 6px;
  text-align: center;
}

.gc-badge {
  position: absolute;
  top: 4px;
  left: 4px;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 1px;
  text-transform: uppercase;
}

.gc-badge.clean {
  background: rgba(76, 107, 34, .12);
  color: var(--green2);
  border: 1px solid rgba(190, 238, 17, .25);
}

.gc-info {
  padding: 6px 7px 8px;
}

.gc-title {
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.gc-meta {
  font-size: 10px;
  color: var(--txt3);
  margin-top: 1px;
}

.gc-tags {
  display: flex;
  gap: 3px;
  margin-top: 4px;
  flex-wrap: wrap;
}

.gc-tag {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 1px;
  background: var(--surf, #252f3d);
  color: var(--txt2);
  border: 1px solid var(--bdr);
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 50px 40px;
  gap: 8px;
}

.empty svg {
  width: 40px;
  height: 40px;
  fill: var(--surf2, #2a3f5f);
}

.empty-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--txt2);
}

.empty-sub {
  font-size: 11px;
  color: var(--txt3);
  text-align: center;
  max-width: 280px;
  line-height: 1.6;
}

.card {
  background: var(--bg3);
  border: 1px solid var(--bdr);
  border-radius: 2px;
  padding: 16px;
}

/* Settings */
.settings-wrap {
  padding: 18px;
  max-width: 600px;
}

.settings-block {
  background: var(--bg3);
  border: 1px solid var(--bdr);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 14px;
}

.settings-block-title {
  font-size: 11px;
  font-weight: 800;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: .6px;
  padding: 9px 13px;
  background: var(--surf, #252f3d);
  border-bottom: 1px solid var(--bdr);
}

.s-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 13px;
  border-bottom: 1px solid var(--bdr);
  gap: 14px;
}

.s-row:last-child {
  border-bottom: none;
}

.s-row-lbl {
  font-size: 12px;
  color: #fff;
}

.s-row-sub {
  font-size: 10px;
  color: var(--txt3);
  margin-top: 1px;
}

.toggle {
  width: 34px;
  height: 18px;
  border-radius: 9px;
  background: #252f3d;
  border: 1px solid var(--bdr2, #3d5a73);
  cursor: pointer;
  position: relative;
  transition: all .2s;
  flex-shrink: 0;
}

.toggle.on {
  background: var(--green2);
}

.toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s;
}

.toggle.on::after {
  transform: translateX(16px);
}

/* Achievements */
.achievement-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
  padding: 14px 18px;
}

.ach-card {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg3);
  border: 1px solid var(--bdr);
  border-radius: 2px;
  padding: 10px 12px;
  transition: border-color .15s;
}

.ach-card.unlocked {
  border-color: rgba(190, 238, 17, .25);
}

.ach-card.locked {
  opacity: .5;
  filter: grayscale(.7);
}

.ach-icon {
  width: 36px;
  height: 36px;
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--surf, #252f3d);
}

.ach-card.unlocked .ach-icon {
  background: rgba(76, 107, 34, .1);
  color: var(--green2);
}

.ach-name {
  font-size: 12px;
  font-weight: 700;
  color: #fff;
}

.ach-desc {
  font-size: 10px;
  color: var(--txt3);
  margin-top: 1px;
}

/* Friends */
.friend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  border-bottom: 1px solid var(--bdr);
  cursor: pointer;
  transition: background .15s;
}

.friend-item:hover {
  background: rgba(255, 255, 255, .03);
}

.friend-av {
  width: 34px;
  height: 34px;
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
  position: relative;
}

.online-dot {
  position: absolute;
  bottom: -1px;
  right: -1px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid var(--bg2);
}

.online-dot.online {
  background: #57cbde;
}

.online-dot.away {
  background: var(--yellow);
}

.online-dot.offline {
  background: var(--txt3);
}

.friend-name {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
}

.friend-status {
  font-size: 10px;
  color: var(--txt3);
}

.friend-actions {
  margin-left: auto;
  display: flex;
  gap: 5px;
}

/* Modal */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .72);
  z-index: 200;
  align-items: center;
  justify-content: center;
}

.modal-bg.open {
  display: flex;
}

.modal {
  background: var(--bg3);
  border: 1px solid var(--bdr);
  border-radius: 3px;
  width: 640px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .7);
}

.modal-hdr {
  padding: 13px 16px;
  border-bottom: 1px solid var(--bdr);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
}

.modal-x {
  width: 20px;
  height: 20px;
  background: var(--surf, #252f3d);
  border: none;
  border-radius: 2px;
  color: var(--txt2);
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-x:hover {
  background: var(--surf2, #2a3f5f);
  color: #fff;
}

.modal-body {
  padding: 16px;
}

/* Toasts */
.toasts {
  position: fixed;
  bottom: 14px;
  right: 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  z-index: 9999;
  pointer-events: none;
}

.toast {
  background: var(--bg3);
  border: 1px solid var(--bdr);
  border-radius: 2px;
  padding: 8px 12px;
  font-size: 12px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 7px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, .5);
  animation: tin .18s ease;
  max-width: 290px;
}

.toast.success {
  border-left: 3px solid var(--green2);
}

.toast.error {
  border-left: 3px solid var(--red2);
}

.toast.info {
  border-left: 3px solid var(--blue);
}

@keyframes tin {
  from { opacity: 0; transform: translateX(10px); }
  to { opacity: 1; transform: translateX(0); }
}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo-wrap">
      <div class="auth-logo">TEVIVE</div>
      <div style="font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--txt3)">Gaming Platform</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="authTab('login')">Sign In</button>
      <button class="auth-tab" onclick="authTab('register')">Create Account</button>
    </div>
    <form class="auth-form" id="auth-login" onsubmit="doLogin(event)">
      <div class="auth-field">
        <label class="auth-label">Email</label>
        <input class="auth-input" id="li-email" type="email" placeholder="you@email.com" autocomplete="email" required/>
      </div>
      <div class="auth-field">
        <label class="auth-label">Password</label>
        <input class="auth-input" id="li-pw" type="password" placeholder="••••••••" autocomplete="current-password" required/>
      </div>
      <div class="auth-error" id="li-err"></div>
      <button class="auth-submit" type="submit">Sign In</button>
    </form>
    <form class="auth-form hidden" id="auth-register" onsubmit="doRegister(event)" style="display:none">
      <div class="auth-field">
        <label class="auth-label">Username</label>
        <input class="auth-input" id="rg-user" type="text" placeholder="CoolGamer99" autocomplete="username" required/>
        <div class="auth-label" style="margin-top:1px">Letters, numbers, _ - . only. Min. 3 characters.</div>
      </div>
      <div class="auth-field">
        <label class="auth-label">Email</label>
        <input class="auth-input" id="rg-email" type="email" placeholder="your@email.com" autocomplete="email" required/>
        <div class="auth-label" style="margin-top:1px">Must be a valid email address with @</div>
      </div>
      <div class="auth-field">
        <label class="auth-label">Password</label>
        <input class="auth-input" id="rg-pw" type="password" placeholder="At least 6 characters" autocomplete="new-password" required/>
      </div>
      <div class="auth-error" id="rg-err"></div>
      <button class="auth-submit" type="submit">Create Account</button>
    </form>

</div>

<div id="app" style="display:none">
  <!-- Header -->
  <div class="hdr">
    <div class="hdr-logo">TEV<span style="color:var(--blue)">I</span>VE</div>
    <div class="hdr-nav">
      <a id="hn-store" class="active" onclick="topNav(this,'store-home')">STORE</a>
      <a id="hn-library" onclick="topNav(this,'library')">LIBRARY</a>
      <a id="hn-upload" onclick="topNav(this,'upload')">UPLOAD</a>
    </div>
    <div class="hdr-right">
      <div class="hdr-user" onclick="showPage('profile')">
        <div class="avatar" id="hdr-av" style="background:#256a9f">T</div>
        <div class="hdr-username" id="hdr-uname">Loading…</div>
      </div>
    </div>
  </div>

  <div class="body">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar"></div>

    <!-- Main -->
    <div class="main" id="main"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
let currentUser = null;

function authTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((el,i) => {
    el.classList.toggle('active', (i===0 && tab==='login') || (i===1 && tab==='register'));
  });
  document.getElementById('auth-login').style.display = tab==='login' ? 'flex' : 'none';
  document.getElementById('auth-register').style.display = tab==='register' ? 'flex' : 'none';
}

function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('li-email').value;
  const pw = document.getElementById('li-pw').value;
  const err = document.getElementById('li-err');
  
  if (!email.includes('@')) {
    err.textContent = 'Invalid email format';
    err.classList.add('show');
    return;
  }
  
  currentUser = { username: email.split('@')[0], email, id: '1', isAdmin: false, isVerified: false };
  showApp();
}

function doRegister(e) {
  e.preventDefault();
  const username = document.getElementById('rg-user').value;
  const email = document.getElementById('rg-email').value;
  const pw = document.getElementById('rg-pw').value;
  const err = document.getElementById('rg-err');
  
  if (!email.includes('@')) {
    err.textContent = 'email validation fixed';
    err.classList.add('show');
    return;
  }
  
  if (pw.length < 6) {
    err.textContent = 'Password too short';
    err.classList.add('show');
    return;
  }
  
  currentUser = { username, email, id: '1', isAdmin: false, isVerified: false };
  showApp();
}

function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderSidebar();
  showPage('store-home');
  document.getElementById('hdr-uname').textContent = currentUser.username;
  document.getElementById('hdr-av').textContent = currentUser.username[0].toUpperCase();
  showToast('Welcome, ' + currentUser.username, 'success');
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = `
    <div class="sb-section" style="margin-top:12px">Featured</div>
    <div class="sb-item active" onclick="showPage('store-home'); setSidebarActive(this)">🏠 Home</div>
    <div class="sb-item" onclick="showPage('store-browse'); setSidebarActive(this)">🔍 Browse</div>
    <div class="sb-item" onclick="showPage('wishlist'); setSidebarActive(this)" style="margin-bottom:8px">❤️ Wishlist</div>
    
    <div class="sb-section">Library</div>
    <div class="sb-item" onclick="showPage('library'); setSidebarActive(this)">📚 My Games</div>
    <div class="sb-item" onclick="showPage('downloads'); setSidebarActive(this)" style="margin-bottom:8px">📥 Downloads<span class="sb-badge blue">0</span></div>
    
    <div class="sb-section">Community</div>
    <div class="sb-item" onclick="showPage('achievements'); setSidebarActive(this)">🏆 Achievements</div>
    <div class="sb-item" onclick="showPage('friends'); setSidebarActive(this)" style="margin-bottom:8px">👥 Friends</div>
    
    <div class="sb-divider"></div>
    <div class="sb-section">Account</div>
    <div class="sb-item" onclick="showPage('profile'); setSidebarActive(this)">👤 Profile</div>
    <div class="sb-item" onclick="showPage('settings'); setSidebarActive(this)">⚙️ Settings</div>
    ${currentUser.isAdmin ? '<div class="sb-item" onclick="showPage(\'admin\'); setSidebarActive(this)">👑 Admin</div>' : ''}
    <div class="sb-item" onclick="doLogout()">🚪 Logout</div>
  `;
}

function setSidebarActive(el) {
  document.querySelectorAll('.sb-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
}

function showPage(page) {
  const pages = {
    'store-home': renderStoreHome,
    'store-browse': renderStoreBrowse,
    'library': renderLibrary,
    'wishlist': renderWishlist,
    'achievements': renderAchievements,
    'friends': renderFriends,
    'profile': renderProfile,
    'settings': renderSettings,
    'admin': renderAdmin,
    'downloads': renderDownloads,
  };
  
  if (pages[page]) pages[page]();
}

function topNav(el, page) {
  document.querySelectorAll('.hdr-nav a').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  showPage(page);
}

function renderStoreHome() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="hero-banner">
      <div class="hero-bg"></div>

        <div class="hero-tag">FEATURED</div>

}

  const main = document.getElementById('main');

      </div>
    </div>
  `;
}

function renderLibrary() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div style="padding:18px"><div style="font-size:20px;font-weight:700;color:#fff;margin-bottom:6px">Library</div><div style="font-size:12px;color:var(--txt2);margin-bottom:14px">Your installed & downloaded games</div></div>
    <div style="padding:0 18px;margin-bottom:24px">
      <div id="lib-list"></div>
      <div class="empty" id="lib-empty"><svg viewBox="0 0 24 24"><path d="M4 6h18V4H4c-1.1 0-2 .9-2 2v13H0v3h14v-3H4V6z m20 2h-8c-.5 0-1 .45-1 1v10c0 .55.45 1 1 1h8c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 9h-6v-7h6v7z"/></svg><div class="empty-title">No games installed</div><div class="empty-sub">Download a game from the Store</div></div>
    </div>
  `;
}

  const main = document.getElementById('main');
  main.innerHTML = `
    <div style="padding:18px"><div style="font-size:20px;font-weight:700;color:#fff;margin-bottom:6px">Wishlist</div><div style="font-size:12px;color:var(--txt2);margin-bottom:14px">Games you want to download later</div></div>
    <div style="padding:0 18px"><div class="game-grid" id="wishlist-grid"></div><div class="empty" id="wishlist-empty"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><div class="empty-title">Your wishlist is empty</div><div class="empty-sub">Click the heart icon on any game card to add it</div></div>
  `;
}

function renderAchievements() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div style="padding:18px"><div style="font-size:20px;font-weight:700;color:#fff;margin-bottom:6px">Achievements</div><div style="font-size:12px;color:var(--txt2);margin-bottom:14px">Your progress</div></div>
    <div style="padding:0 18px;margin-bottom:24px">
      <div class="achievement-grid">
        ${['First Steps','Downloader','Publisher','Safety First','Collector','Veteran','Curator','Gamer','Administrator'].map((n,i) => `<div class="ach-card ${i<3 ? 'unlocked' : 'locked'}"><div class="ach-icon">${i<3 ? '🔓' : '🔒'}</div><div><div class="ach-name">${n}</div><div class="ach-desc">${n} achievement</div></div></div>`).join('')}
      </div>
    </div>
  `;
}

function renderFriends() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div style="padding:18px"><div style="font-size:20px;font-weight:700;color:#fff;margin-bottom:6px">Friends</div><div style="font-size:12px;color:var(--txt2);margin-bottom:14px">Find and manage your friends</div></div>
    <div style="padding:0 18px;display:flex;gap:7px;margin-bottom:14px">
      <input type="text" placeholder="Search username…" style="flex:1;max-width:240px;padding:4px 9px;font-size:12px;background:#1b2838;border:1px solid var(--bdr);border-radius:2px;color:#fff;outline:none">
      <button class="btn btn-blue btn-sm">Search</button>
    </div>
    <div id="friends-list" style="padding:0 18px">
      <div class="friend-item"><div class="friend-av" style="background:#256a9f">A<div class="online-dot online"></div></div><div><div class="friend-name">AlexGamer</div><div class="friend-status">Playing Game Name</div></div><button class="btn btn-ghost btn-sm">Remove</button></div>
    </div>
  `;
}

function renderProfile() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div style="background:linear-gradient(to bottom, #1a3a5c 0%, var(--bg2) 100%);padding:20px;border-bottom:1px solid var(--bdr);display:flex;gap:16px;align-items:flex-end">
      <div class="avatar" style="background:#256a9f;width:64px;height:64px;font-size:28px;font-weight:900">${currentUser.username[0].toUpperCase()}</div>
      <div>
        <div style="font-size:20px;font-weight:800;color:#fff">${currentUser.username}</div>
        <div style="font-size:11px;color:var(--txt2)">${currentUser.email}</div>
      </div>
    </div>
    <div style="padding:18px;max-width:600px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px">
        <div class="card"><div style="font-size:20px;font-weight:900;color:var(--blue)">0h</div><div style="font-size:11px;color:var(--txt3);margin-top:1px;text-transform:uppercase;letter-spacing:.5px">Playtime</div></div>
        <div class="card"><div style="font-size:20px;font-weight:900;color:var(--green2)">0</div><div style="font-size:11px;color:var(--txt3);margin-top:1px;text-transform:uppercase;letter-spacing:.5px">Games</div></div>
      </div>
      <div style="border-top:1px solid var(--bdr);padding-top:18px;margin-bottom:24px">
        <div style="font-size:12px;font-weight:700;color:#fff;margin-bottom:12px">Edit Profile</div>
        <div style="display:flex;flex-direction:column;gap:8px;max-width:480px">
          <input type="text" placeholder="Username" value="${currentUser.username}" style="padding:6px 9px;font-size:12px;background:var(--bg3);border:1px solid var(--bdr);border-radius:2px;color:#fff;outline:none">
          <textarea placeholder="Tell others about yourself…" style="padding:6px 9px;font-size:12px;background:var(--bg3);border:1px solid var(--bdr);border-radius:2px;color:#fff;outline:none;min-height:50px;resize:vertical;font-family:inherit"></textarea>
          <button class="btn btn-blue btn-sm" style="width:fit-content">Save Changes</button>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sign Out</button>
    </div>
  `;
}

function renderSettings() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="settings-wrap">
      <div class="settings-block">
        <div class="settings-block-title">📥 Downloads</div>
        <div class="s-row">
          <div>
            <div class="s-row-lbl">Download Folder</div>

function renderAdmin() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div style="padding:18px"><div style="font-size:20px;font-weight:700;color:#fff;margin-bottom:14px">👑 Admin Panel</div>
    <div style="background:var(--purple);padding:16px;border-radius:2px;margin-bottom:18px;color:#fff;font-weight:600">✓ Admin Activated</div>
    <div style="background:var(--bg3);border:1px solid var(--bdr);border-radius:2px;overflow:hidden">

          <thead>
            <tr style="background:var(--surf,#252f3d)">

            </tr>

              <td style="padding:12px;color:var(--txt2)">${currentUser.username}</td>

function renderDownloads() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div style="padding:18px"><div style="font-size:20px;font-weight:700;color:#fff;margin-bottom:6px">Downloads</div><div style="font-size:12px;color:var(--txt2);margin-bottom:14px">Active and completed downloads</div></div>
    <div class="empty" style="margin-top:40px"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg><div class="empty-title">No active downloads</div><div class="empty-sub">Start a download from the Store</div></div>
  `;
}

function showToast(msg, type='info') {
  const cont = document.getElementById('toasts');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  cont.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function doLogout() {
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('li-email').value = '';
  document.getElementById('li-pw').value = '';
  document.getElementById('rg-user').value = '';
  document.getElementById('rg-email').value = '';
  document.getElementById('rg-pw').value = '';
  document.getElementById('li-err').classList.remove('show');
  document.getElementById('rg-err').classList.remove('show');
  authTab('login');
}
</script>
</body>
</html>
