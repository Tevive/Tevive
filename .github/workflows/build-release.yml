name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm --filter @workspace/tevive-desktop install

      - name: Build Windows installer
        run: pnpm --filter @workspace/tevive-desktop run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          TEVIVE_URL: https://tevive.replit.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/tevive-desktop/release/tevive_setup_windows.exe
          name: Tevive ${{ github.ref_name }}
          body: |
            ## Tevive ${{ github.ref_name }}

            The free game platform — browse, upload, and play games for free.

            ### Installation
            1. Download `tevive_setup_windows.exe`
            2. Run the installer and follow the setup wizard
            3. Tevive opens automatically after installation
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
