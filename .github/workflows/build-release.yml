name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: artifacts/tevive-desktop
        run: npm install

      - name: Build Windows installer
        working-directory: artifacts/tevive-desktop
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Format release name
        id: release_name
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME="Tevive $(echo "$TAG" | tr '-' ' ')"
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tevive-windows-installer
          path: artifacts/tevive-desktop/release/tevive_setup_windows.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/tevive-desktop/release/tevive_setup_windows.exe
          name: ${{ steps.release_name.outputs.name }}
          body: |
            ## ${{ steps.release_name.outputs.name }}

            The free game platform — browse, upload, and play games for free.

            ### Installation
            1. Download `tevive_setup_windows.exe`
            2. Run the installer and follow the setup wizard
            3. Tevive opens automatically after installation

            ### What is Tevive?
            - Upload PC games (EXE/ZIP) or link a GitHub repository
            - Every upload is scanned for malware before going live
            - Community reviews and ratings
            - 100% free — no wallets, no payments

            ### System Requirements
            - Windows 10/11 x64
          draft: false
          prerelease: false
