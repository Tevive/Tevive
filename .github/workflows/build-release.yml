name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: artifacts/tevive-desktop
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows installer
        working-directory: artifacts/tevive-desktop
        run: pnpm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Update existing release with new installer
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Get the first/oldest release (the existing one)
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10
            });

            if (releases.data.length === 0) {
              core.setFailed('No existing release found');
              return;
            }

            // Use the first release (oldest)
            const release = releases.data[releases.data.length - 1];
            console.log(`Updating release: "${release.name}" (id: ${release.id}, tag: ${release.tag_name})`);

            // Delete old installer asset if present
            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id
            });

            for (const asset of assets.data) {
              if (asset.name === 'tevive_setup_windows.exe') {
                console.log(`Removing old asset (id: ${asset.id})...`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
            }

            // Upload the freshly built installer
            const installerPath = 'artifacts/tevive-desktop/release/tevive_setup_windows.exe';
            const installerData = fs.readFileSync(installerPath);

            console.log(`Uploading new installer (${(installerData.length / 1024 / 1024).toFixed(1)} MB)...`);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: 'tevive_setup_windows.exe',
              data: installerData
            });

            console.log('Done — installer updated on existing release.');
